# Mosquitto config for the bundled `mqtt` service (dashboard/docker-compose.yml).
# Mosquitto 2 only accepts local connections unless a listener is declared.
listener 1883
listener 9001
protocol websockets

# Internal network. To require login: create a password file with
# `mosquitto_passwd -c /mosquitto/config/passwd <user>`, then replace the line
# below with `allow_anonymous false` + `password_file /mosquitto/config/passwd`.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
