services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: edge-dashboard:latest
    container_name: edge-dashboard
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "3001:3000"
    # Same as the camera containers: lets Settings → PostgreSQL use
    # host.docker.internal (the default) for Face Enrollment's DB access.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # runtime: nvidia
    volumes:
      - ../python-counting:/python-counting
      - /var/run/docker.sock:/var/run/docker.sock
      - dashboard-data:/app/data
      # - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
    environment:
      - PYTHON_COUNTING_DIR=/python-counting
      - HOST_PYTHON_COUNTING_DIR=${HOST_PYTHON_COUNTING_DIR}
      - SETTINGS_FILE=/app/data/settings.json
      - NODERED_URL=http://nodered:1880
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    networks:
      - default
      - envisions
    depends_on:
      - nodered

  # Dashboard-owned RTSP -> HLS/MSE/WebRTC gateway (Go service in
  # ../stream-gateway). Built from source here so `docker compose up -d --build`
  # in this directory builds it alongside the dashboard — it used to be
  # generated into python-counting's compose as a bare `image:` with no build
  # context, so the image was never built and every "Expose CCTV URL" call 502'd
  # against a container that had never existed.
  #
  # No environment is needed: the Go defaults (LISTEN_ADDR=:8555,
  # WEBRTC_UDP_MUX_PORT=8189) already match the published ports, and
  # PUBLIC_BASE_URL is irrelevant now that the browser rewrites the host of the
  # returned URLs itself (see toReachableStreamUrl in lib/utils.ts).
  stream-gateway:
    build:
      context: ../stream-gateway
      dockerfile: Dockerfile
    image: stream-gateway:latest
    container_name: stream-gateway
    restart: unless-stopped
    ports:
      - "8555:8555"
      - "8189:8189/udp"
    networks:
      - default
      - envisions

  # Dashboard-owned, stream-only nginx dedicated to raw TCP (RTSP)
  # port-forwarding. The dashboard regenerates its ENTIRE nginx.conf from
  # every device's PORTFWD_* vars (see dashboard/lib/portforward.ts) — it does
  # NOT share the reverse-proxy nginx of any other stack, so a bad forward can
  # never break the web/admin/peerjs stack.
  #
  # The whole 5500-5600 host-port range is published up front so adding/removing
  # a forward via the dashboard NEVER needs this container to be recreated — any
  # listen port the dashboard picks inside that range is already reachable from
  # the host. (Docker can't add published ports to a running container, so the
  # range is the trick that makes it fully dashboard-controlled.)
  #
  # NOTE: publishing a range binds EVERY port in it on the host — if some other
  # container already publishes a port in 5500-5600 (e.g. a legacy hand-written
  # nginx forward), this service fails to start with "address already in use".
  # Shift the range here + LISTEN_PORT_MIN/MAX in lib/portforward.ts together if
  # that happens.
  edge-portfwd-nginx:
    image: nginx:1.27-alpine
    container_name: edge-portfwd-nginx
    restart: unless-stopped
    ports:
      - "5500-5600:5500-5600"
    volumes:
      # Bind-mounted single file: the dashboard writes back via `cat >`
      # (truncate-in-place), which works on a bind mount, so generated config
      # persists across restart/recreate.
      - ./nginx/portfwd-nginx.conf:/etc/nginx/nginx.conf
    networks:
      - default
      - envisions
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    volumes:
      - nodered-data:/data
      - ./nodered/settings.js:/data/settings.js:ro
      - ./nodered/custom-theme.css:/data/custom-theme.css:ro
    ports:
      - "1880:1880"   # direct access for local dev / debugging only — the
                        # dashboard proxies /automation to this internally
                        # over the envisions network in normal use
    networks:
      - envisions

  # Multi-arch (amd64 + arm64/Jetson). The -ha image is amd64-only and dies with
  # "exec format error" on Jetson. Data lives at /var/lib/postgresql/data here
  # (the -ha image used /home/postgres/pgdata/data).
  timescaledb:
    container_name: env_services_timescaledb
    image: timescale/timescaledb:latest-pg14
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescaledb_volume:/var/lib/postgresql/data
    networks:
      - envisions
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: env_services_mqtt
    ports:
      - "1884:1883"
      - "9001:9001"
    networks:
      - envisions
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

volumes:
  dashboard-data:
  nodered-data:
  timescaledb_volume:
networks:
  default: {}
  envisions:
    driver: bridge
    name: envisions
