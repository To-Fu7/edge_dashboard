services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: edge-dashboard:latest
    container_name: edge-dashboard
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "3000:3000"
    runtime: ${DOCKER_RUNTIME:-runc}
    volumes:
      - ../python-counting:/python-counting
      - ../stream-gateway:/stream-gateway:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - dashboard-data:/app/data
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
    environment:
      - PYTHON_COUNTING_DIR=/python-counting
      - HOST_PYTHON_COUNTING_DIR=${HOST_PYTHON_COUNTING_DIR}
      - STREAM_GATEWAY_DIR=/stream-gateway
      - SETTINGS_FILE=/app/data/settings.json
      - NODERED_URL=http://edge-nodered:1880
      - AUTH_SECRET=${AUTH_SECRET}
      - USERS_FILE=/app/data/users.json
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    networks:
      - default
      - envisions
    depends_on:
      nodered:
        condition: service_healthy

  nodered:
    image: nodered/node-red:latest
    container_name: edge-nodered
    restart: unless-stopped
    runtime: runc   # force standard OCI runtime — nodered has no GPU needs,
                    # and the Jetson's default-runtime is nvidia which would fail here
    volumes:
      - nodered-data:/data
    ports:
      - "1880:1880"   # direct access for local dev / debugging only
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - envisions

volumes:
  dashboard-data:
  nodered-data:

networks:
  default: {}
  envisions:
    driver: bridge
    name: envisions
